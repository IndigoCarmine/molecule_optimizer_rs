[package]
name = "molecule_optimizer_rs"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Pure-Rust molecular mechanics: energy, geometry optimization, conformer search (ETKDG) and coordinate scans with async/parallel jobs. Force fields (UFF, MMFF94) and DistGeom ported from RDKit."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
futures = "0.3"
rayon = "1"
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
arc-swap = "1"
wide = "0.7"
rustfft = "6"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[profile.test]
opt-level = 2

[[bench]]
name = "approx"
harness = false
