[package]
name = "molecule_optimizer_rs"
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Pure-Rust molecular mechanics: energy, geometry optimization, conformer search (ETKDG) and coordinate scans with async/parallel jobs. Force fields (UFF, MMFF94) and DistGeom ported from RDKit."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
futures = "0.3"
rayon = "1"
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
arc-swap = "1"
wide = "0.7"
rustfft = "6"
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
# wgpu (Vulkan / Metal / DX12) backend for the approximate nonbonded mode.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[[bench]]
name = "fast"
harness = false

[profile.test]
opt-level = 2

[[bench]]
name = "approx"
harness = false

[[bench]]
name = "set"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["gpu"]
